name = "dailytally2"
main = "src/worker.js"
compatibility_date = "2026-04-27"
compatibility_flags = [ "nodejs_compat" ]

[triggers]
crons = [ "*/15 * * * *" ]

[browser]
binding = "BROWSER"

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = [ "/*" ]

[[d1_databases]]
binding = "DB"
database_name = "dailytally2"
database_id = "ac0f9340-c703-40fd-b816-6063f16e2382"
migrations_dir = "migrations"
